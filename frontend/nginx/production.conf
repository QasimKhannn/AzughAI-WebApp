limit_req_zone $binary_remote_addr zone=one:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=static:10m rate=150r/s;
limit_req_zone $binary_remote_addr zone=media:10m rate=150r/s;
limit_req_status 429;

server {
        listen 80;
        server_name localhost;
        client_max_body_size 250M;

        # Frontend - serve static files instead of proxying to dev server
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            index index.html;
            
            # Add caching headers for static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
                expires 30d;
                add_header Cache-Control "public, max-age=2592000";
                access_log off;
            }
        }

        # Backend API
        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin interface
        location /admin/ {
            proxy_pass http://backend:8000/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static files
        location /static/ {
            alias /staticfiles/;
        }

        # Media files
        location /media/ {
            alias /media/;
        }

        # Set up configuration for streaming chat endpoint
        location ~ ^/api/agent/threads/[^/]+/chat/$ {
            proxy_pass http://backend:8000$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Disable response buffering to enable streaming
            proxy_buffering off;

            # Ensure chunked transfer encoding is disabled
            chunked_transfer_encoding off;

            # Increase timeouts to handle long-lived connections
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            send_timeout 3600s;
        }
}
